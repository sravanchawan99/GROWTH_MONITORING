name: Provision Azure Infrastructure (Manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: eastasia
  AZURE_SUBSCRIPTION_ID: 0823e843-0325-4ebf-8e6c-1b3d3daa50a9
  RESOURCE_GROUP: rg-growthmonitoring
  FUNCTION_APP_NAME: fa-growthmonitoring
  STATIC_WEB_APP_NAME: app-growthmonitoring
  STORAGE_ACCOUNT_PREFIX: stgrowthmonitoring

jobs:
  provision:
    environment: growthmonitoring
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure context
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az account show -o table
            az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
            az account show --query "{id:id, tenantId:tenantId, name:name}" -o table

      - name: Provision resources
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
            echo "==> Active subscription"
            az account show --query "{id:id,name:name,tenantId:tenantId}" -o table

            echo "==> Ensure required resource providers are registered"
            az provider register --namespace Microsoft.Storage --subscription "$AZURE_SUBSCRIPTION_ID" --wait
            az provider register --namespace Microsoft.Web --subscription "$AZURE_SUBSCRIPTION_ID" --wait
            az provider show --namespace Microsoft.Storage --subscription "$AZURE_SUBSCRIPTION_ID" --query registrationState -o tsv
            az provider show --namespace Microsoft.Web --subscription "$AZURE_SUBSCRIPTION_ID" --query registrationState -o tsv

            echo "==> Create/Update resource group"
            az group create \
              --name "$RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --subscription "$AZURE_SUBSCRIPTION_ID"

            CLEAN_SUB_ID=$(echo "$AZURE_SUBSCRIPTION_ID" | tr -d '-')
            SUFFIX=${CLEAN_SUB_ID:0:8}
            STORAGE_ACCOUNT_NAME=$(echo "${STORAGE_ACCOUNT_PREFIX}${SUFFIX}" | tr '[:upper:]' '[:lower:]' | cut -c1-24)

            echo "==> Create storage account: $STORAGE_ACCOUNT_NAME"
            az storage account create \
              --name "$STORAGE_ACCOUNT_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --subscription "$AZURE_SUBSCRIPTION_ID"

            echo "==> Create/Update function app"
            if az functionapp show --name "$FUNCTION_APP_NAME" --resource-group "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" >/dev/null 2>&1; then
              echo "Function App already exists. Skipping create."
              echo "Note: Existing Function Apps are not auto-converted to Consumption by this pipeline."
            else
              az functionapp create \
                --name "$FUNCTION_APP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --storage-account "$STORAGE_ACCOUNT_NAME" \
                --consumption-plan-location "$AZURE_LOCATION" \
                --runtime python \
                --runtime-version 3.11 \
                --functions-version 4 \
                --os-type Linux \
                --subscription "$AZURE_SUBSCRIPTION_ID"
            fi

            echo "==> Configure function app settings"
            az functionapp config appsettings set \
              --name "$FUNCTION_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true \
              --subscription "$AZURE_SUBSCRIPTION_ID"

            echo "==> Create/Update Azure Static Web App"
            if az staticwebapp show --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" >/dev/null 2>&1; then
              echo "Static Web App already exists. Skipping create."
            else
              az staticwebapp create \
                --name "$STATIC_WEB_APP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --location "$AZURE_LOCATION" \
                --sku Free \
                --subscription "$AZURE_SUBSCRIPTION_ID"
            fi

            echo "==> Configure function CORS"
            SWA_HOSTNAME=$(az staticwebapp show \
              --name "$STATIC_WEB_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --query "defaultHostname" -o tsv)
            FRONTEND_ORIGIN="https://${SWA_HOSTNAME}"
            EXISTING_CORS=$(az functionapp cors show \
              --name "$FUNCTION_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "allowedOrigins" -o tsv \
              --subscription "$AZURE_SUBSCRIPTION_ID" || true)
            if echo "$EXISTING_CORS" | grep -qx "$FRONTEND_ORIGIN"; then
              echo "CORS origin already present."
            else
              az functionapp cors add \
                --name "$FUNCTION_APP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --allowed-origins "$FRONTEND_ORIGIN" \
                --subscription "$AZURE_SUBSCRIPTION_ID"
            fi
