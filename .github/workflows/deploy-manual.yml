name: Deploy Backend and Frontend

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FUNCTION_APP_NAME: fa-growthmonitoring

jobs:
  deploy-backend:
    name: Deploy Azure Function
    environment: growthmonitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: BackEnd
          remote-build: true

  deploy-frontend:
    name: Build and Deploy Angular App to Static Web App
    environment: growthmonitoring
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Install dependencies
        working-directory: FrontEnd
        run: npm ci

      - name: Build Angular app
        working-directory: FrontEnd
        run: npm run build -- --configuration production

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_APP_GROWTHMONITORING }}
          action: upload
          skip_app_build: true
          app_location: FrontEnd/dist/front-end
