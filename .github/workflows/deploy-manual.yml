name: Deploy Backend and Frontend
 
on:
  workflow_dispatch:
 
permissions:
  id-token: write
  contents: read
 
env:
  FUNCTION_APP_NAME: fa-growthmonitoring
  WEB_APP_NAME: app-growthmonitoring
  RESOURCE_GROUP: rg-growthmonitoring
 
jobs:
  deploy-backend:
    name: Deploy Azure Function
    environment: growthmonitoring
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
 
      - name: Restore
        run: dotnet restore BackEnd/fa-growthmonitoring/API/API.csproj
 
      - name: Publish
        run: dotnet publish BackEnd/fa-growthmonitoring/API/API.csproj -c Release -o publish
 
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: publish

      - name: Configure FunctionApp App Settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            az functionapp config appsettings set \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --name "${{ env.FUNCTION_APP_NAME }}" \
              --settings APIUrl="https://${{ env.FUNCTION_APP_NAME }}.azurewebsites.net/api/GetLMSValue"
 
            echo "Verifying APIUrl setting..."
            az functionapp config appsettings list \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --name "${{ env.FUNCTION_APP_NAME }}" \
              --query "[?name=='APIUrl']"
      
 
  deploy-frontend:
    name: Build and Deploy Angular App
    environment: growthmonitoring
    runs-on: ubuntu-latest
    needs: deploy-backend
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: FrontEnd/package-lock.json
 
      - name: Install dependencies
        working-directory: FrontEnd
        run: npm ci
 
      - name: Build Angular app
        working-directory: FrontEnd
        run: npm run build -- --configuration production
      - name: Show build output
        run: |
         echo "Contents of dist:"
         find FrontEnd/dist -type f
 
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Verify deployment package
        run: |
         ls -la FrontEnd/dist/front-end

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: FrontEnd/dist/front-end
      - name: Restart Web App
        uses: azure/cli@v2
        with:
        inlineScript: |
         az webapp restart \
         --resource-group "${{ env.RESOURCE_GROUP }}" \
         --name "${{ env.WEB_APP_NAME }}"